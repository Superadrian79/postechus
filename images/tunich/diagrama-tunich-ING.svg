<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 360" width="100%" height="360">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"></stop>
      <stop offset="100%" stop-color="#eef2f7"></stop>
    </linearGradient>

    <!-- Card gradient -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"></stop>
      <stop offset="100%" stop-color="#f3f6fb"></stop>
    </linearGradient>

    <!-- Icon gradients -->
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"></stop>
      <stop offset="100%" stop-color="#1e40af"></stop>
    </linearGradient>

    <linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"></stop>
      <stop offset="100%" stop-color="#6b21a8"></stop>
    </linearGradient>

    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"></stop>
      <stop offset="100%" stop-color="#166534"></stop>
    </linearGradient>

    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"></feDropShadow>
    </filter>

    <!-- Arrow marker -->
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#475569"></path>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1400" height="360" fill="url(#bgGrad)"></rect>

  <!-- Grid -->
  <g stroke="#e2e8f0" stroke-width="1">
    <path d="M0 180 H1400"></path>
    <path d="M350 0 V360"></path>
    <path d="M700 0 V360"></path>
    <path d="M1050 0 V360"></path>
  </g>

  <!-- Card 1 -->
  <rect x="120" y="80" rx="18" ry="18" width="300" height="200" fill="url(#cardGrad)" filter="url(#shadow)"></rect>

  <circle cx="270" cy="120" r="28" fill="url(#gBlue)"></circle>
  <text x="270" y="130" text-anchor="middle" font-family="Courier New, monospace" font-size="20" font-weight="700" fill="#ffffff">!</text>

  <text x="270" y="180" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#0f172a">
    RAW ALERT
  </text>

  <!-- Card 2 -->
  <rect x="550" y="80" rx="18" ry="18" width="300" height="200" fill="url(#cardGrad)" filter="url(#shadow)"></rect>

  <circle cx="700" cy="120" r="28" fill="url(#gPurple)"></circle>
  <text x="700" y="128" text-anchor="middle" font-family="Courier New, monospace" font-size="14" font-weight="700" fill="#ffffff">AI</text>

  <text x="700" y="170" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#0f172a">
    TUNICH AI
  </text>

  <text x="700" y="205" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">
    LLM + RAG
  </text>

  <!-- Card 3 -->
  <rect x="980" y="80" rx="18" ry="18" width="300" height="200" fill="url(#cardGrad)" filter="url(#shadow)"></rect>

  <circle cx="1130" cy="120" r="28" fill="url(#gGreen)"></circle>
  <text x="1130" y="128" text-anchor="middle" font-family="Courier New, monospace" font-size="16" font-weight="700" fill="#ffffff">✓</text>

  <text x="1130" y="165" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#0f172a">
    ENRICHED TICKET
  </text>

  <text x="1130" y="198" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">
    READY FOR ACTION
  </text>

  <!-- Arrows -->
  <line x1="420" y1="180" x2="550" y2="180" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"></line>

  <line x1="850" y1="180" x2="980" y2="180" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"></line>
</svg>
