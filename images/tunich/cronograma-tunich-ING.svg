<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" width="100%" height="420">
  <defs>
    <!-- Background -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"></stop>
      <stop offset="100%" stop-color="#020617"></stop>
    </linearGradient>

    <!-- Card -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"></stop>
      <stop offset="100%" stop-color="#020617"></stop>
    </linearGradient>

    <!-- Execution gradient -->
    <linearGradient id="gExec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"></stop>
      <stop offset="100%" stop-color="#2563eb"></stop>
    </linearGradient>

    <!-- Planned outline -->
    <linearGradient id="gPlan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#facc15"></stop>
      <stop offset="100%" stop-color="#f97316"></stop>
    </linearGradient>

    <!-- Shadow -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.5"></feDropShadow>
    </filter>

    <!-- Clip paths for animation -->
    <clipPath id="clipRow1"><rect x="240" y="100" width="0" height="36" rx="18"></rect></clipPath>
    <clipPath id="clipRow2"><rect x="240" y="160" width="0" height="36" rx="18"></rect></clipPath>
    <clipPath id="clipRow3"><rect x="240" y="220" width="0" height="36" rx="18"></rect></clipPath>
    <clipPath id="clipRow4"><rect x="240" y="280" width="0" height="36" rx="18"></rect></clipPath>

    <style>
      /* Animations */
      #clipRow1 rect { animation: grow1 1.2s ease-out forwards; }
      #clipRow2 rect { animation: grow2 1.2s ease-out forwards; animation-delay:.15s; }
      #clipRow3 rect { animation: grow3 1.2s ease-out forwards; animation-delay:.3s; }
      #clipRow4 rect { animation: grow4 1.2s ease-out forwards; animation-delay:.45s; }

      @keyframes grow1 { to { width:420px; } }
      @keyframes grow2 { to { width:520px; } }
      @keyframes grow3 { to { width:600px; } }
      @keyframes grow4 { to { width:700px; } }

      @media (prefers-reduced-motion: reduce) {
        #clipRow1 rect, #clipRow2 rect, #clipRow3 rect, #clipRow4 rect {
          animation:none; width:999px;
        }
      }

      /* Typography */
      .tWeek {
        fill:#e5e7eb;
        font:600 18px Inter, Arial, sans-serif;
      }

      .tBadge {
        fill:#facc15;
        font:700 15px Inter, Arial, sans-serif;
        letter-spacing:.5px;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1400" height="420" fill="url(#bgGrad)"></rect>

  <!-- Grid -->
  <g stroke="#1e293b" stroke-width="1">
    <path d="M0 210 H1400"></path>
    <path d="M400 0 V420"></path>
    <path d="M700 0 V420"></path>
    <path d="M1000 0 V420"></path>
  </g>

  <!-- Card -->
  <rect x="60" y="50" width="1280" height="320" rx="24" fill="url(#cardGrad)" filter="url(#shadow)"></rect>

  <!-- ===== Row 1 ===== -->
  <text class="tWeek" x="100" y="125">Week 1–2</text>

  <g clip-path="url(#clipRow1)">
    <rect x="240" y="100" width="420" height="36" rx="18" fill="url(#gExec)"></rect>
  </g>

  <rect x="990" y="96" width="340" height="44" rx="22" fill="none" stroke="url(#gPlan)" stroke-width="2" stroke-dasharray="6 6"></rect>

  <text class="tBadge" x="1160" y="124" text-anchor="middle">
    Infrastructure Preparation
  </text>

  <!-- ===== Row 2 ===== -->
  <text class="tWeek" x="100" y="185">Week 3</text>

  <g clip-path="url(#clipRow2)">
    <rect x="240" y="160" width="520" height="36" rx="18" fill="url(#gExec)"></rect>
  </g>

  <rect x="990" y="156" width="340" height="44" rx="22" fill="none" stroke="url(#gPlan)" stroke-width="2" stroke-dasharray="6 6"></rect>

  <text class="tBadge" x="1160" y="184" text-anchor="middle">
    Install and Configurate
  </text>

  <!-- ===== Row 3 ===== -->
  <text class="tWeek" x="100" y="245">Week 4</text>

  <g clip-path="url(#clipRow3)">
    <rect x="240" y="220" width="600" height="36" rx="18" fill="url(#gExec)"></rect>
  </g>

  <rect x="990" y="216" width="340" height="44" rx="22" fill="none" stroke="url(#gPlan)" stroke-width="2" stroke-dasharray="6 6"></rect>

  <text class="tBadge" x="1160" y="244" text-anchor="middle">
    Integration and testing
  </text>

  <!-- ===== Row 4 ===== -->
  <text class="tWeek" x="100" y="305">Week 5–6</text>

  <g clip-path="url(#clipRow4)">
    <rect x="240" y="280" width="700" height="36" rx="18" fill="url(#gExec)"></rect>
  </g>

  <rect x="990" y="276" width="340" height="44" rx="22" fill="none" stroke="url(#gPlan)" stroke-width="2" stroke-dasharray="6 6"></rect>

  <text class="tBadge" x="1160" y="304" text-anchor="middle">
    Operative Pilot and Capacitation
  </text>
</svg>
